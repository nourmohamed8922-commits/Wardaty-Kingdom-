{ar:'المدينة المنسية',en:'The Forgotten City',bg:0x1a1230,gr:0x4a4258,pa:0x8c7f6a,hd:0x6b6075,pr:'ruin',pc:[0x8c8296,0x6a6078],n:34,items:4,mech:'plates',ic:0xffb86b,inm:{ar:'ذكريات المدينة',en:'city memories'},
q:{ar:[['بين الأطلال وجدتما رسالة قديمة: «رحل الجميع حين نسوا أن يصغوا لبعضهم».','لو أعدنا هذه المدينة إلى الحياة، فبماذا نبدأ؟',['نعيد سكانها إليها','نرمّم أبنيتها وطرقها','نجمع حكاياتها المنسية'],['البيوت لا تعيش بالحجر، بل بمن يضحك فيها.','فلنبدأ بالحجر الأول، ولنُبقِ الباب مفتوحًا.','إذن نكتب تاريخها من جديد، سطرًا سطرًا.']],
['في ساحة المدينة مصباح قديم ينتظر من يُشعله.','هل نتركه مضاءً للغائبين، أم نحمله معنا؟',['نتركه مضاءً ليعودوا','نحمله ونكمل الطريق','نكتب اسمينا عليه ذكرى'],'ارتفع الضوء فوق الأسقف، وكأن المدينة ابتسمت.']],
en:[["Among the ruins you find an old letter: \"Everyone left when they forgot to listen to one another.\"",'If we bring this city back to life, where do we begin?',['Bring its people home','Restore its buildings and roads','Gather its forgotten stories'],['Houses live not by stone, but by those who laugh in them.','Then the first stone, and we keep the door open.','Then we write its history again, line by line.']],
['In the city square an old lamp waits for someone to light it.','Do we leave it lit for the absent, or carry it with us?',['Leave it lit so they can return','Carry it and walk on','Carve our names on it as a memory'],'The light rose above the rooftops, as if the city smiled.']]}},
{ar:'الغابة المسحورة',en:'The Enchanted Forest',bg:0x07161a,gr:0x0f3b2e,pa:0x2c6b5a,hd:0x12663f,pr:'tree',pc:[0x2fbf9a,0x58e6b0],glow:.55,n:52,items:5,mech:'seq',ic:0x7dffcb,inm:{ar:'كرات الضوء',en:'light orbs'},
q:{ar:[['الأشجار هنا تهمس، وكل همسة لها لون.','حين تضيع في الغابة، بماذا تهتدي؟',['بصوت من أحب','بالضوء الذي يلمع بعيدًا','بما أتذكره من الطريق'],['إذن لن نفترق أبدًا في هذه الغابة.','فلنتبع الضوء معًا.','ذاكرتك خريطة جميلة، سأثق بها.']],
['روح الغابة الصغيرة ظهرت أخيرًا، متعبة وخجولة.','كيف نطمئنها؟',['نجلس بجانبها بهدوء','نغني لها لحنًا قديمًا','نريها الطريق إلى بيتها'],'ابتسمت الروح، وتفتحت الأزهار حولكما.']],
en:[['The trees whisper here, and every whisper has a color.','When you are lost in a forest, what guides you?',["The voice of someone I love",'A light shining far away','What I remember of the path'],['Then we will never part in this forest.','Then let us follow the light together.','Your memory is a lovely map. I will trust it.']],
['The little forest spirit finally appears, tired and shy.','How do we reassure it?',['Sit beside it quietly','Sing it an old tune','Show it the way home'],'The spirit smiled, and flowers bloomed around you.']]}},
{ar:'قلعة الذكريات',en:'The Castle of Memories',bg:0x1b1030,gr:0x3a2f5c,pa:0xb9a6e8,hd:0x4b3d7a,pr:'tower',pc:[0x7b6bb8,0xd8c7ff],n:30,items:4,mech:'code',ic:0xff9de2,inm:{ar:'شظايا الذاكرة',en:'memory fragments'},
q:{ar:[['على الجدران لوحات تتحرك: ملوك قدماء وضحكات لم تنتهِ.','أي ذكرى تتمنى أن تحفظها للأبد؟',['لحظة جمعتنا بمن نحب','مكانًا لن أنسى جماله','أول مرة التقينا فيها'],['الأحباب أجمل ما تحفظه القلاع.','المكان يحرس الذكرى كما يحرس السور القلب.','وهذه بالذات تستحق إطارًا من ذهب.']],
['في القاعة الأخيرة مرآة تعرض ما كان وما سيكون.','ماذا تريدين أن ترى فيها؟',['وجوه من نحبهم سعداء','عالمًا جديدًا نستكشفه','ذكرياتنا وقد كبرت معنا'],'أضاءت المرآة ثم عادت صافية، كأنها تعرفكما.']],
en:[['Paintings move on the walls: ancient kings and laughter that never ended.','Which memory do you wish to keep forever?',['A moment with those we love','A place whose beauty I will never forget','The first time we met'],['Loved ones are the best thing a castle keeps.','A place guards a memory as a wall guards a heart.','This one deserves a frame of gold.']],
['In the last hall, a mirror shows what was and what will be.','What do you want to see in it?',['The faces of loved ones, happy','A new world to explore','Our memories grown up with us'],'The mirror glowed, then cleared, as if it knew you both.']]}},
{ar:'البحيرة الفضية',en:'The Silver Lake',bg:0x0a1a33,gr:0x24527a,pa:0x9fc9e8,hd:0x2f6f8f,pr:'lake',pc:[0xcfeaff,0x6fb8e6],n:26,items:5,mech:'seq',ic:0xcfefff,inm:{ar:'النجوم المنعكسة',en:'reflected stars'},
q:{ar:[['على سطح البحيرة تتراقص أطياف ذكريات منسية.','لو كانت البحيرة مرآة قلبك، فماذا ترى؟',['أشخاصًا أحبهم','مكانًا أريد أن أصل إليه','لحظات لن تعود'],['قلبك مليء بالناس، وهذا غنى.','وأنا سأمشي معك إلى هناك.','سنجعلها تعود في ذاكرة لا تتعب.']],
['تحت الماء مكتبة قديمة تلمع كنجوم غارقة.','أي كتاب نفتح أولًا؟',['كتاب أسماء الأوفياء','كتاب الخرائط القديمة','كتاب الذكريات الأولى'],'انفتحت الصفحات وحدها، كأنها كانت تنتظركما.']],
en:[['On the lake, spirits of forgotten memories dance.','If the lake were the mirror of your heart, what would you see?',['People I love','A place I long to reach','Moments that will not return'],['Your heart is full of people, and that is wealth.','Then I will walk with you there.','We will make them return in a memory that never tires.']],
['Beneath the water, an old library glows like drowned stars.','Which book do we open first?',['The book of the faithful','The book of old maps','The book of first memories'],'The pages opened by themselves, as if waiting for you.']]}},
{ar:'المملكة تحت الأرض',en:'The Kingdom Beneath',bg:0x120a24,gr:0x2a1f3d,pa:0x5b4a82,hd:0x3a2a5c,pr:'crystal',pc:[0x5fe6ff,0xb06bff],n:26,items:5,mech:'plates',ic:0x5fe6ff,nm:1,nf:1,inm:{ar:'نوى البلور',en:'crystal cores'},
q:{ar:[['البلورات تنبض تحت الأرض كأنها قلب كبير.','ما الذي يُبقي الضوء حيًّا في الظلام؟',['أن نتشارك الحمل','أن نبحث عن مخرج جديد','أن نتذكر لماذا بدأنا'],['الحمل المشترك أخف، والضوء أصفى.','الطرق الجديدة تولد من الجرأة.','من يتذكر البداية لا يضيع.']],
['أهل المدينة السفلى ينتظرون اشتعال شبكة البلور.','ما أول ما نقوله لهم؟',['أنتم لستم وحدكم','سنفتح لكم طريقًا إلى السماء','سنحفظ حكايتكم معنا'],'اشتعلت الشبكة كلها دفعة واحدة، وغنّى الجميع.']],
en:[['The crystals pulse underground like one great heart.','What keeps the light alive in the dark?',['Sharing the load','Searching for a new way out','Remembering why we began'],['A shared load is lighter, and the light clearer.','New roads are born of courage.','Whoever remembers the start never gets lost.']],
['The people below wait for the crystal network to light.','What do we tell them first?',['You are not alone','We will open you a road to the sky','We will keep your story with us'],'The whole network lit at once, and everyone sang.']]}},
{ar:'التحالفات السبعة',en:'The Seven Alliances',bg:0x3a1a3a,hm:0xffb38a,gr:0x3a5a3a,pa:0xd8b878,hd:0x7a4a2a,pr:'banner',pc:[0xff7a59,0xffd166],n:30,items:7,mech:'code',ic:0xff9f5a,inm:{ar:'أختام التحالف',en:'alliance seals'},
q:{ar:[['سبع مناطق تنتظر من يمدّ يده إليها، بلا سيف ولا راية حرب.','كيف نكسب صداقة مملكة غريبة؟',['نصغي إلى أهلها أولًا','نزور أجمل ما فيها','نتبادل الحكايات معهم'],['الإصغاء أول لغات السلام.','من يرى جمال أرضٍ يحبها.','الحكايات جسور لا تُهدم.']],
['اجتمع ممثلو الممالك السبع حول طاولة واحدة.','ما الذي نكتبه على الميثاق؟',['أن نحمي بعضنا','أن نفتح الطرق لبعضنا','أن نتذكر بعضنا'],'وُقّع الميثاق بسبعة أختام، وصفّق الجميع.']],
en:[['Seven regions wait for a hand to be offered, with no sword and no war banner.','How do we win a strange kingdom\'s friendship?',['Listen to its people first','Visit the best of it','Trade stories with them'],['Listening is the first language of peace.','Whoever sees a land\'s beauty loves it.','Stories are bridges that never fall.']],
['Envoys of the seven kingdoms gather around one table.','What do we write on the charter?',['That we protect one another','That we open roads to one another','That we remember one another'],'The charter was signed with seven seals, and everyone applauded.']]}},
{ar:'النجوم السبعة',en:'The Seven Stars',bg:0x050524,gr:0x1a1a4a,pa:0x6a6ad8,hd:0x3a3a8a,pr:'float',pc:[0xb7a6ff,0xffffff],n:24,items:7,mech:'seq',ic:0xffe08a,inm:{ar:'نجوم القيم',en:'value stars'},
vals:{ar:['نجمة الثقة','نجمة الصدق','نجمة اللطف','نجمة الصبر','نجمة التفاهم','نجمة الشجاعة','نجمة الحب'],en:['Star of Trust','Star of Honesty','Star of Kindness','Star of Patience','Star of Understanding','Star of Courage','Star of Love']},
q:{ar:[['كل نجمة قيمة: الثقة، الصدق، اللطف، الصبر، التفاهم، الشجاعة، الحب.','أي القيم أقرب إلى قلبنا؟',['الثقة والصدق','الشجاعة والصبر','الحب والتفاهم'],['بالثقة يُبنى كل شيء.','الشجاعة تبدأ الطريق والصبر يُتمّه.','وبالحب يكتمل ما سواه.']],
['اجتمعت النجوم السبع في كفٍّ واحدة.','هل نحتفظ بها أم نعيدها إلى السماء؟',['نعيدها لتضيء للجميع','نحتفظ بها لحماية مملكتنا','نحفظ ضوءها ذكرى فينا'],'تألقت النجوم السبع، وعرفت أين مكانها.']],
en:[['Each star is a value: trust, honesty, kindness, patience, understanding, courage, love.','Which value is closest to our hearts?',['Trust and honesty','Courage and patience','Love and understanding'],['Everything is built on trust.','Courage begins the road and patience finishes it.','And love completes all the rest.']],
['The seven stars gather in a single palm.','Do we keep them or return them to the sky?',['Return them to light everyone','Keep them to protect our kingdom','Keep their light as a memory in us'],'The seven stars shone, and knew where they belonged.']]}},
{ar:'سقوط النجوم',en:'The Falling Stars',bg:0x10081f,gr:0x241a3a,pa:0x5a4a7a,hd:0x3a2a55,pr:'tree',pc:[0x3a3a6a,0x4a4a8a],n:34,items:4,mech:'plates',ic:0xb0b0ff,echo:1,inm:{ar:'النجوم الخافتة',en:'fading stars'},
q:{ar:[['النجوم تخفت واحدة تلو الأخرى، والسماء تسكت.','لماذا تخفت النجوم برأيك؟',['لأن أحدًا لم يعد يصغي','لأننا ابتعدنا عن بعض الأماكن','لأننا نسينا حكايات قديمة'],['إذن علينا أن نصغي من جديد.','فلنعد إلى أماكننا الأولى.','فلنتذكرها بصوتٍ عالٍ.']],
['في قلب المملكة ينبض ضوء ضعيف ينتظر منكما شيئًا.','ماذا نمنحه؟',['وقتًا ننصت فيه','طريقًا نعبره معًا','ذاكرة نرويها له'],'عاد النبض قويًا، وبدأت النجوم تلمع من جديد.']],
en:[['The stars dim one by one, and the sky falls silent.','Why do you think the stars are fading?',['Because no one listens anymore','Because we drifted from certain places','Because we forgot old stories'],['Then we must listen anew.','Then let us return to our first places.','Then let us remember them aloud.']],
['In the heart of the kingdom a faint light pulses, waiting for something from you.','What do we give it?',['Time to listen','A road we cross together','A memory we tell it'],'The pulse grew strong, and the stars began to shine again.']]}},
{ar:'عهد الأبد',en:'The Eternal Promise',bg:0x1a0f2e,hm:0xffe0a8,gr:0x2f2a58,pa:0xf0c878,hd:0x6a4aa8,pr:'tower',pc:[0xf0c878,0xffffff],n:26,items:4,mech:'code',ic:0xffe08a,inm:{ar:'أنوار الرحلة',en:'lights of the journey'},
q:{ar:[['وصلتما إلى قلب المملكة، حيث كل حكايتكما معلّقة كنجوم صغيرة.','ما الذي صنع مملكتنا حقًا؟',['الناس الذين التقينا بهم','الأماكن التي عبرناها','الذكريات التي صنعناها'],['أحببناهم، فصاروا مملكتنا.','كل أرض عبرناها صارت جزءًا منا.','والذكريات هي ما يبقى حين ينتهي كل شيء.']],
['أمامكما الباب الأخير، ولا يُفتح إلا بوعد.','ما وعدنا الأبدي؟',['أن نحب الناس كما أحببنا بعضنا','أن نبقى نستكشف معًا دائمًا','أن نحفظ حكايتنا ونرويها'],'اشتعل قلب المملكة، وانفتح الباب على النهاية التي كتبتماها معًا.']],
en:[['You reach the heart of the kingdom, where your whole story hangs like tiny stars.','What truly made our kingdom?',['The people we met','The places we crossed','The memories we made'],['We loved them, and they became our kingdom.','Every land we crossed became part of us.','Memories are what remain when everything ends.']],
['Before you stands the last door, opened only by a promise.','What is our eternal promise?',['To love people as we loved each other','To keep exploring together, always','To keep our story and tell it'],'The heart of the kingdom blazed, and the door opened onto the ending you wrote together.']]}}];
